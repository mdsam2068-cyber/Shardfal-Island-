name: Build Android APK
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor, three.js and fonts
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 three@0.128.0 @fontsource/unbounded @fontsource/outfit
      - name: Prepare the game files (everything inside the app, works offline)
        run: |
          mkdir -p www/fonts
          cp index.html www/index.html
          cp node_modules/three/build/three.min.js www/three.min.js
          cp icon-*.png manifest.webmanifest www/ || true
          python3 - <<'PY'
          import glob, re, shutil
          h = open('www/index.html', encoding='utf8').read()
          assert 'cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js' in h, 'three tag not found'
          h = h.replace('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'three.min.js')
          h = re.sub(r'<link rel="preconnect"[^>]*>\s*', '', h)
          h = re.sub(r'<link rel="stylesheet" href="https://fonts.googleapis.com[^>]*>', '<link rel="stylesheet" href="fonts.css">', h)
          h = re.sub(r'<script>\s*if\(.serviceWorker. in navigator\).*?</script>', '', h, flags=re.S)
          wake = "<script>(function(){var l=null;function w(){try{if(navigator.wakeLock&&!l)navigator.wakeLock.request('screen').then(function(x){l=x;x.addEventListener('release',function(){l=null;});}).catch(function(){});}catch(e){}}document.addEventListener('pointerdown',w);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')w();});})();</script>\n</body>"
          h = h.replace('</body>', wake, 1)
          open('www/index.html', 'w', encoding='utf8').write(h)
          css = ''
          for fam, pkg, ws in (('Unbounded', 'unbounded', (500, 700)), ('Outfit', 'outfit', (400, 600))):
              for w in ws:
                  src = glob.glob('node_modules/@fontsource/%s/files/%s-latin-%d-normal.woff2' % (pkg, pkg, w))
                  if not src:
                      print('font missing', fam, w)
                      continue
                  shutil.copy(src[0], 'www/fonts/%s-%d.woff2' % (pkg, w))
                  css += "@font-face{font-family:'%s';font-weight:%d;font-style:normal;font-display:swap;src:url(fonts/%s-%d.woff2) format('woff2');}\n" % (fam, w, pkg, w)
          open('www/fonts.css', 'w').write(css)
          print(css)
          print('external links left:', re.findall(r'(?:src|href)="(https?://[^"]+)"', h))
          PY
      - name: Create the Android project
        run: |
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.shardfall.isle","appName":"Shardfall Isle","webDir":"www","android":{"backgroundColor":"#0d1426"}}
          JSON
          npx cap add android
          npx cap sync android
      - name: Landscape, fullscreen, keep screen on, icon
        run: |
          find android/app/src/main -not -path '*/res/*' -not -path '*/assets/*' || true
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf8').read()
          if 'screenOrientation' not in s:
              s = s.replace('<activity', '<activity android:screenOrientation="sensorLandscape"', 1)
          open(p, 'w', encoding='utf8').write(s)
          print(s)
          PY
          MA=$(find android/app/src/main/java -name MainActivity.java -print -quit)
          echo "MainActivity is at: $MA"
          PK=$(grep -m1 '^package' "$MA")
          {
            echo "$PK"
            cat <<'JAVA'
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              hideBars();
            }
            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hideBars();
            }
            private void hideBars() {
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
            }
          }
          JAVA
          } > /tmp/MainActivity.java
          cp /tmp/MainActivity.java "$MA"
          cat "$MA"
      - name: App icon (nice to have, never stops the build)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq imagemagick || true
          IM=$(command -v magick || command -v convert)
          echo "using $IM"
          R=android/app/src/main/res
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            d=${spec%%:*}; rest=${spec#*:}; s=${rest%%:*}; f=${rest#*:}
            mkdir -p $R/mipmap-$d
            $IM icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            $IM icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher_round.png
            $IM icon-maskable-512.png -resize ${f}x${f} $R/mipmap-$d/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#0D1426</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
      - name: Use the same signing key every build (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../shardfall-isle.apk
      - name: Publish the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Shardfall Isle APK (latest)
          body: Download shardfall-isle.apk below and install it on your phone.
          files: shardfall-isle.apk
          make_latest: true
