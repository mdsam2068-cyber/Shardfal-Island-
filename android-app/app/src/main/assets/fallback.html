<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shardfall Isle</title>
    <style>
      body {
        margin: 0;
        background: #07131d;
        color: #eef7ff;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .box {
        max-width: 560px;
        padding: 28px;
        border-radius: 18px;
        background: rgba(17, 28, 38, 0.9);
        border: 1px solid rgba(95,231,255,0.28);
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      }
      h1 { margin-top: 0; font-size: clamp(2rem, 4vw, 3rem); }
      p { line-height: 1.6; opacity: 0.9; }
      a { color: #5fe7ff; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Shardfall Isle</h1>
      <p>The game assets are unavailable locally in this build. The app will attempt to load the live web version.</p>
      <p>If you are offline, connect to the internet or package the game files into the Android app assets.</p>
      <p><a href="https://mdsam2068-cyber.github.io/Shardfal-Island-/">Open live game</a></p>
    </div>
  </body>
</html>
