<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shardfall Isle</title>
<meta name="theme-color" content="#0d1426">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D canvas, HUD pinned to the safe edges, move zone left, look zone right, jump and dash buttons bottom right. */
:root{
  --night:#0d1426; --glass:rgba(9,16,34,.58); --glass-edge:rgba(255,255,255,.18);
  --paper:#fff4e0; --muted:#b9c6dc; --cyan:#5fe7ff; --amber:#ffc95c; --coral:#ff7b5c;
  --display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--body);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:var(--night)}
#stage canvas{display:block;width:100%;height:100%}
#fade{position:fixed;inset:0;background:#fff4e0;opacity:0;pointer-events:none;z-index:30;transition:opacity .5s ease}
#fade.on{opacity:1;transition:none}
.zone{position:fixed;top:0;bottom:0;z-index:2;touch-action:none}
#zoneMove{left:0;width:50%}
#zoneLook{right:0;width:50%}
#stickBase{position:fixed;z-index:3;width:124px;height:124px;border-radius:50%;border:2px solid var(--glass-edge);background:rgba(255,255,255,.07);pointer-events:none;opacity:.3;transform:translate(-50%,-50%);transition:opacity .15s}
#stickBase.on{opacity:.95}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.8)}
.glass{background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#tally{position:fixed;z-index:8;pointer-events:none;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;padding:8px 14px 8px 10px;border-radius:16px}
#tally .gem{width:28px;height:28px;color:var(--cyan);flex:none}
#tally .num{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
#tally .num span{font:500 13px var(--display);color:var(--muted)}
#tally .sub{margin-top:4px;font:600 12px var(--body);color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
#compass{position:fixed;z-index:8;pointer-events:auto;cursor:pointer;touch-action:none;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:16px}
#compass svg{width:22px;height:22px;color:var(--cyan);transition:transform .08s linear}
#compass span{font:600 14px var(--body);font-variant-numeric:tabular-nums;min-width:4.4em}
#rightbox{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
#map{width:108px;height:108px;border-radius:50%;border:2px solid var(--glass-edge);background:#0b3b52}
.mini{display:flex;gap:8px;pointer-events:auto}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--paper);cursor:pointer;padding:0;font:inherit}
.ib svg{width:20px;height:20px}
.ib:focus-visible,.cta:focus-visible,.act:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#toast{position:fixed;z-index:9;left:50%;top:24%;transform:translateX(-50%);pointer-events:none;font:700 clamp(16px,4.4vw,24px) var(--display);text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.55);opacity:0;white-space:nowrap}
#toast.show{animation:pop 1.6s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.act{position:fixed;z-index:6;border-radius:50%;border:2px solid rgba(255,255,255,.55);color:var(--paper);display:grid;place-items:center;touch-action:none;cursor:pointer;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);--cd:1;background:conic-gradient(rgba(255,255,255,.34) calc(var(--cd)*360deg),rgba(255,255,255,.1) 0)}
.act svg{width:46%;height:46%;pointer-events:none}
#btnPulse{right:calc(max(16px,env(safe-area-inset-right,0px)) + 106px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:72px;height:72px}
#btnJump{right:calc(max(16px,env(safe-area-inset-right,0px)) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:88px;height:88px}
#btnDash{right:calc(max(16px,env(safe-area-inset-right,0px)) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 138px);width:58px;height:58px}
#screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 60%,rgba(8,14,30,.15),rgba(8,14,30,.62))}
.panel{width:min(100%,440px);max-height:100%;overflow:auto;padding:24px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);touch-action:pan-y}
.title{font:700 clamp(26px,7vw,40px)/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.title span{color:var(--cyan)}
.lede{margin-top:12px;font-size:17px;line-height:1.45;color:var(--paper);max-width:34em}
.help{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.help li{display:grid;grid-template-columns:7.5em 1fr;gap:10px;font-size:15px;line-height:1.35}
.help b{font-weight:600;color:var(--amber)}
.help span{color:var(--muted)}
.kbd{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.4}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.cta{font:700 14px var(--display);background:var(--amber);color:#2a1a05;border:0;border-radius:14px;padding:15px 22px;cursor:pointer}
.cta.ghost{background:transparent;color:var(--paper);border:1px solid var(--glass-edge)}
.best{margin-top:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.big{margin-top:14px;font:700 34px var(--display);color:var(--cyan);font-variant-numeric:tabular-nums}
@media (max-width:460px){
  #compass{left:max(16px,env(safe-area-inset-left,0px));transform:none;top:calc(env(safe-area-inset-top,0px) + 66px)}
  #map{width:92px;height:92px}
  .help li{grid-template-columns:6.5em 1fr}
}

#tally{flex-direction:column;align-items:flex-start;gap:7px;min-width:178px;padding:10px 14px}
.scoreline{display:flex;align-items:baseline;gap:8px;position:relative;width:100%}
.lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#score{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.mult{font:700 12px var(--display);color:var(--amber);min-width:2.4em}
.pop{position:absolute;right:0;top:-16px;font:700 14px var(--display);color:var(--cyan);opacity:0}
.pop.show{animation:rise .9s ease forwards}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.hpwrap{display:flex;align-items:center;gap:8px;width:100%}
.hpwrap svg{width:18px;height:18px;color:var(--coral);flex:none}
.hpbar{position:relative;flex:1;height:15px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7b5c,#ffc95c);transition:width .15s}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font:700 10px var(--display);text-shadow:0 1px 2px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
#bossbar{position:fixed;z-index:8;pointer-events:none;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);width:min(60vw,340px);padding:8px 12px;border-radius:14px}
.bn{font:700 11px var(--display);letter-spacing:.06em;margin-bottom:6px;color:#ffb3a6}
.bb{height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.bb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b06bff,#ff3d5a);transition:width .12s}
#dialog{position:fixed;z-index:9;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:clamp(260px,46vw,440px);padding:10px 14px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .25s}
#dialog.on{opacity:1}
#dialog b{font:700 11px var(--display);letter-spacing:.1em}
#dialog p{margin:4px 0 0;font-size:15px;line-height:1.35}
#chapter{position:fixed;z-index:12;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;width:92vw}
#chapter.show{animation:chap 4.2s ease forwards}
#chapter small{display:block;font:600 12px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
#chapter h2{margin:6px 0 0;font:700 clamp(24px,7vw,44px)/1.05 var(--display);text-shadow:0 3px 24px rgba(0,0,0,.6);text-wrap:balance}
@keyframes chap{0%{opacity:0;transform:translate(-50%,-46%)}15%{opacity:1;transform:translate(-50%,-50%)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-54%)}}
#hurt{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,40,40,0) 42%,rgba(255,40,40,.7));opacity:0}
.stats{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.stats li{display:flex;flex-direction:column;gap:2px}
.stats span{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats b{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.quote{margin-top:12px;font-size:16px;line-height:1.45;color:var(--paper);border-left:3px solid var(--cyan);padding-left:12px}
.quote small{display:block;margin-top:4px;font:700 11px var(--display);letter-spacing:.1em;color:var(--cyan)}
.story p{margin:12px 0 0;font-size:16px;line-height:1.5;max-width:34em}
details{margin-top:14px}
summary{cursor:pointer;font:600 14px var(--body);color:var(--amber)}
@media (max-width:700px){#dialog{bottom:calc(env(safe-area-inset-bottom,0px) + 236px);width:min(92vw,440px)}}
@media (max-width:460px){#compass{top:calc(env(safe-area-inset-top,0px) + 132px)}#bossbar{top:calc(env(safe-area-inset-top,0px) + 176px);width:min(70vw,300px)}}
@media (max-height:430px){
  #screen{padding:10px}
  .panel{width:min(100%,600px);padding:14px 18px}
  .title{font-size:24px}
  .help{grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:10px}
  .help li{grid-template-columns:1fr;gap:0;font-size:13px}
  .lede{margin-top:6px;font-size:14px;line-height:1.35}
  .kbd{display:none}
  .story p{margin-top:6px;font-size:14px;line-height:1.35}
  .stats{margin-top:8px;grid-template-columns:repeat(6,1fr);gap:6px}
  .gfx{margin-top:8px}
  .stats b{font-size:15px}
  .quote{margin-top:8px;font-size:14px}
  details{margin-top:8px}
  .row{margin-top:12px}
  .cta{padding:12px 20px}
  .best{margin-top:8px}
  #toast{top:30%}
}
.gfx{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.gfx .lbl{margin-right:4px}
.gb{font:600 13px var(--body);color:var(--paper);background:transparent;border:1px solid var(--glass-edge);border-radius:999px;padding:8px 14px;cursor:pointer}
.gb[aria-pressed=true]{background:var(--cyan);color:#06222b;border-color:var(--cyan)}
.gb:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#diag{position:fixed;left:8px;bottom:8px;z-index:50;max-width:min(92vw,560px);margin:0;padding:8px 10px;border-radius:8px;background:rgba(130,12,12,.88);color:#fff;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;pointer-events:none}
@media (prefers-reduced-motion:reduce){#toast.show{animation-duration:.01s}}
</style>

<div id="stage"></div>
<div id="fade"></div>
<div id="zoneMove" class="zone"></div>
<div id="zoneLook" class="zone"></div>
<div id="stickBase" hidden><div id="stickKnob"></div></div>

<div id="tally" class="glass" hidden>
  <div class="scoreline"><span class="lbl">Score</span><b id="score">0</b><span id="mult" class="mult">x1</span><span id="pop" class="pop"></span></div>
  <div class="hpwrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11Z" fill="currentColor"/></svg><div class="hpbar"><i id="hpfill"></i><span id="hptext">100</span></div></div>
  <div class="sub"><span id="nightlbl">Day 1</span> · <span id="tod">Morning</span> · <span id="clock">0:00</span></div>
</div>
<div id="compass" class="glass" hidden><svg id="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20 21 12 16 4 21Z" fill="currentColor"/></svg><span id="dist">–</span></div>
<div id="bossbar" class="glass" hidden><div class="bn" id="bossname">THE HOLLOW WARDEN</div><div class="bb"><i id="bossfill"></i></div></div>
<div id="rightbox" hidden>
  <canvas id="map" width="108" height="108" aria-label="Island map"></canvas>
  <div class="mini">
    <button id="btnMute" class="ib glass" type="button" aria-label="Sound on or off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9Z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button id="btnPause" class="ib glass" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  </div>
</div>
<div id="toast"></div>
<div id="dialog" class="glass"><b id="dspk">LUMEN</b><p id="dtxt"></p></div>
<div id="chapter"><small id="chk"></small><h2 id="cht"></h2></div>
<div id="hurt"></div>
<button id="btnDash" class="act" type="button" aria-label="Dash" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6Z"/></svg></button>
<button id="btnPulse" class="act" type="button" aria-label="Lantern pulse" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="2.6" fill="currentColor"/><circle cx="12" cy="12" r="6.5"/><path d="M12 1.5v2.2M12 20.3v2.2M1.5 12h2.2M20.3 12h2.2"/></svg></button>
<button id="btnJump" class="act" type="button" aria-label="Jump" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/><path d="m6 20 6-6 6 6"/></svg></button>
<div id="screen"><div class="panel" id="panel"><h1 class="title">Shardfall <span>Isle</span></h1><p class="lede">Loading the island…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
function fatal(msg){$('panel').innerHTML='<h1 class="title">Shardfall <span>Isle</span></h1><p class="lede">'+msg+'</p>';}
const diagEl=document.createElement('pre');diagEl.id='diag';diagEl.hidden=true;document.body.appendChild(diagEl);
const diagSeen=new Set();
function diag(msg){msg=String(msg).slice(0,300);if(diagSeen.has(msg)||diagSeen.size>5)return;diagSeen.add(msg);diagEl.textContent+=(diagEl.textContent?'\n':'')+msg;diagEl.hidden=false;}
window.addEventListener('error',e=>diag('Error: '+e.message+(e.lineno?' (line '+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>diag('Error: '+((e.reason&&e.reason.message)||e.reason)));
const _ce=console.error;console.error=function(){try{diag('GL: '+Array.prototype.join.call(arguments,' '));}catch(_){}_ce.apply(console,arguments);};
if(!window.THREE){fatal('The 3D engine did not load. Check your connection and reload the page.');return;}
const THREE=window.THREE;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=mulberry32(20261029);
function hash2(ix,iz,seed){let h=(Math.imul(ix,374761393)+Math.imul(iz,668265263)+Math.imul(seed,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967295;}
function vnoise(x,z,seed){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);
  const a=hash2(ix,iz,seed),b=hash2(ix+1,iz,seed),c=hash2(ix,iz+1,seed),d=hash2(ix+1,iz+1,seed);return lerp(lerp(a,b,ux),lerp(c,d,ux),uz);}
function fbm(x,z,seed,oct){let a=1,f=1,s=0,n=0;for(let i=0;i<oct;i++){s+=a*vnoise(x*f,z*f,seed+i*17);n+=a;a*=0.5;f*=2.03;}return s/n;}

/* ---------- world shape ---------- */
const WORLD=700,HALF=WORLD/2,ISLE_R=285;
const bumpRand=mulberry32(777);
const BUMPS=[];for(let i=0;i<7;i++){const a=bumpRand()*6.283,r=40+bumpRand()*150;BUMPS.push({x:Math.cos(a)*r,z:Math.sin(a)*r,r:35+bumpRand()*45,h:0.18+bumpRand()*0.22});}
function rawHeight(x,z){
  const d=Math.sqrt(x*x+z*z)/ISLE_R;
  const mask=Math.pow(clamp(1-d,0,1),0.85),sm=Math.sqrt(mask);
  const e=fbm(x*0.0075+11.3,z*0.0075-4.7,3,5);
  const ridge=1-Math.abs(vnoise(x*0.012,z*0.012,9)*2-1);
  let raw=e*0.62+mask*0.84+ridge*0.14*mask;
  for(let i=0;i<BUMPS.length;i++){const b=BUMPS[i],dd=((x-b.x)*(x-b.x)+(z-b.z)*(z-b.z))/(b.r*b.r);if(dd<4)raw+=b.h*Math.exp(-dd)*sm*1.4;}
  raw+=(vnoise(x*0.06,z*0.06,31)-0.5)*0.05*mask;
  return Math.max((raw-0.5)*34,-6);
}
const SUM={x:0,z:0,h:0,ready:false};
(function(){let best=-1e9;for(let x=-150;x<=150;x+=4)for(let z=-150;z<=150;z+=4){const h=rawHeight(x,z);if(h>best){best=h;SUM.x=x;SUM.z=z;}}SUM.h=best-0.2;SUM.ready=true;})();
function height(x,z){let h=rawHeight(x,z);if(SUM.ready){const dd=Math.hypot(x-SUM.x,z-SUM.z);const t=1-smooth(5.5,12,dd);if(t>0)h=lerp(h,SUM.h,t);}return h;}

/* ---------- renderer, scene, camera ---------- */
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
catch(e){fatal('This browser could not start 3D graphics (WebGL). Try Chrome on your phone.');return;}
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();diag('The graphics context was lost. Reload the page.');});
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x6ec1f0);
scene.fog=new THREE.Fog(0xa8dcf5,40,230);
let VD=1;
function setView(v){VD=v;scene.fog.near=40*v;scene.fog.far=230*v;}
const camera=new THREE.PerspectiveCamera(62,1,0.3,900);
const hemi=new THREE.HemisphereLight(0xcfe9ff,0x5f7f48,0.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff6e0,0.9);
sun.shadow.camera.left=-34;sun.shadow.camera.right=34;sun.shadow.camera.top=34;sun.shadow.camera.bottom=-34;
sun.shadow.camera.near=0.5;sun.shadow.camera.far=240;sun.shadow.bias=-0.0008;sun.shadow.normalBias=0.04;sun.shadow.camera.updateProjectionMatrix();

/* ---------- terrain (chunked) ---------- */

function makeParticles(n,additive,grow){

  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(siz,1));geo.setAttribute('aAlpha',new THREE.BufferAttribute(alp,1));
  const mat=new THREE.ShaderMaterial({uniforms:{uScale:{value:300}},transparent:true,depthWrite:false,blending:additive?THREE.AdditiveBlending:THREE.NormalBlending,
    vertexShader:'attribute vec3 aColor;attribute float aSize;attribute float aAlpha;uniform float uScale;varying vec3 vC;varying float vA;void main(){vC=aColor;vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uScale/max(0.5,-mv.z);gl_Position=projectionMatrix*mv;}',
    fragmentShader:'varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-0.5);gl_FragColor=vec4(vC,vA*(1.0-smoothstep(0.05,0.5,d)));}'});
  const pts=new THREE.Points(geo,mat);pts.frustumCulled=false;scene.add(pts);
  const vel=new Float32Array(n*3),life=new Float32Array(n),mx=new Float32Array(n),grav=new Float32Array(n),s0=new Float32Array(n);let head=0;
  return{mat,
    emit(x,y,z,vx,vy,vz,r,g,b,size,lf,gr){const i=head;head=(head+1)%n;pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;vel[i*3]=vx;vel[i*3+1]=vy;vel[i*3+2]=vz;col[i*3]=r;col[i*3+1]=g;col[i*3+2]=b;s0[i]=size;life[i]=mx[i]=lf;grav[i]=gr;},
    update(dt){for(let i=0;i<n;i++){if(life[i]<=0){alp[i]=0;continue;}life[i]-=dt;if(life[i]<=0){alp[i]=0;continue;}
      const a=life[i]/mx[i];pos[i*3]+=vel[i*3]*dt;pos[i*3+1]+=vel[i*3+1]*dt;pos[i*3+2]+=vel[i*3+2]*dt;vel[i*3+1]-=grav[i]*dt;const dr=Math.max(0,1-2.2*dt);vel[i*3]*=dr;vel[i*3+2]*=dr;
      alp[i]=a;siz[i]=grow?s0[i]*(1.7-0.7*a):s0[i]*(0.4+0.6*a);}
      geo.attributes.position.needsUpdate=geo.attributes.aAlpha.needsUpdate=geo.attributes.aSize.needsUpdate=geo.attributes.aColor.needsUpdate=true;}
  };
}

function playBeat(st,beat,t,spb){

    if(bi===0){DAY_CH[ci].forEach(n=>mtone(MF(n),spb*4,'sine',0.045,t,0.9));mtone(MF(ROOTS_DAY[ci])/2,spb*4,'triangle',0.07,t,0.4);}

  }else if(st==='night'){
    if(bi===0){NIGHT_CH[ci].forEach(n=>mtone(MF(n),spb*4,'triangle',0.03,t,1.0));mtone(MF(ROOTS_NIGHT[ci])/4,spb*4,'sine',0.1,t,0.5);}

  }else{
    mtone(120,0.2,'sine',0.34,t,0.004,40);
    mnoise(t+spb/2,0.05,7000,0.06,'highpass');
    if(bi===1||bi===3)mnoise(t,0.14,1800,0.16,'bandpass');
    const r=MF(ROOTS_NIGHT[ci])/2;mtone(r,spb/2,'sawtooth',0.05,t,0.005);mtone(r*(bi%2?1.5:1),spb/2,'sawtooth',0.045,t+spb/2,0.005);

    if(Math.random()<0.4){const n=NIGHT_CH[ci][(Math.random()*3)|0]+24;mtone(MF(n),spb*0.7,'triangle',0.05,t+spb*0.25,0.01);}
  }
}

/* ---------- player ---------- */
function moveHoriz(dx,dz){
  const nx=P.x+dx,nz=P.z+dz;
  if(canStand(nx,nz)){P.x=nx;P.z=nz;return;}
  if(canStand(nx,P.z))P.x=nx;else S.vx=0;
  if(canStand(P.x,nz))P.z=nz;else S.vz=0;
}
function canStand(x,z){
  const h=groundH(x,z);
  if(h<-1.05&&h<groundH(P.x,P.z))return false;
  const rise=h-P.y,step=Math.hypot(x-P.x,z-P.z);
  return S.grounded?rise<=step*1.25+0.04:rise<=0.25;
}
function resolveColliders(){
  const cx=Math.floor(P.x/COLL),cz=Math.floor(P.z/COLL);
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const l=cgrid.get((cx+a)+','+(cz+b));if(!l)continue;
    for(const c of l){const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz),m=c.r+0.4;if(d<m&&d>1e-4){P.x=c.x+dx/d*m;P.z=c.z+dz/d*m;}}}
}
function footColor(h){return h<0.1?0xd8f2ff:h<1.4?0xe8d8a8:0xb9d08c;}
function doJump(v,air){

  if(air){tone(520,0.18,'triangle',0.16,1040);ring(sparks,P.x,P.y+0.2,P.z,16,4.5,0x5fe7ff,0.35,0.45);}
  else{tone(360,0.16,'sine',0.18,720);burst(dust,P.x,P.y+0.1,P.z,8,2,1,footColor(P.y),0.7,0.45,-1);}
}
function land(v){
  S.squash=clamp(v/26,0.08,0.4);if(v>18)S.shake=Math.max(S.shake,0.25);puff(0.14,380,Math.min(0.6,v/30),'lowpass');

}
function angLerp(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t;}
function updatePlayer(dt){
  const act=mode==='play';
  G.senseT=Math.max(0,G.senseT-dt);G.senseCD=Math.max(0,G.senseCD-dt);G.invuln=Math.max(0,G.invuln-dt);G.pulseCD=Math.max(0,G.pulseCD-dt);G.hurt=Math.max(0,G.hurt-dt*2.5);
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0){G.combo=0;G.mult=1;}}
  if(pulseReq){pulseReq=false;if(act)doPulse();}
  let ix=0,iy=0;
  if(act){ix=stick.x+K.right-K.left;iy=stick.y+K.up-K.down;const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;}}
  const sy=Math.sin(yaw),cy=Math.cos(yaw);
  const wx=-sy*iy+cy*ix,wz=-cy*iy-sy*ix;
  const hereH=groundH(P.x,P.z),wade=S.grounded&&hereH<-0.1;
  S.dashCD=Math.max(0,S.dashCD-dt);
  if(dashReq){dashReq=false;if(act&&S.dashCD<=0){
    S.dashT=0.24;S.dashCD=1.3;let dx=wx,dz=wz;const l=Math.hypot(dx,dz);
    if(l<0.1){dx=Math.sin(S.face);dz=Math.cos(S.face);}else{dx/=l;dz/=l;}S.dx=dx;S.dz=dz;
    puff(0.3,600,0.4,'bandpass',2400);tone(220,0.2,'sawtooth',0.04,440);if(!S.grounded)S.vy=Math.max(S.vy,2.5);
  }}
  if(S.dashT>0){S.dashT-=dt;S.vx=S.dx*19;S.vz=S.dz*19;
    for(let i=0;i<2;i++)sparks.emit(P.x+(rand()-0.5)*0.4,P.y+0.4+rand()*1.2,P.z+(rand()-0.5)*0.4,0,0.3,0,0.5,0.9,1,0.5,0.35,0);}
  else{const k=S.grounded?14:5,a=1-Math.exp(-k*dt),sp=7.4*(wade?0.7:1);S.vx+=(wx*sp-S.vx)*a;S.vz+=(wz*sp-S.vz)*a;}
  S.jumpBuf=Math.max(0,S.jumpBuf-dt);S.coyote=S.grounded?0.12:Math.max(0,S.coyote-dt);
  if(act&&S.jumpBuf>0){if(S.coyote>0)doJump(11.2,false);else if(S.jumps<2)doJump(9.6,true);}
  if(!(jumpHeld||K.space)&&S.vy>5.5&&!S.cut){S.vy*=0.55;S.cut=true;}
  S.vy=Math.max(S.vy-(S.dashT>0?6:31)*dt,-40);
  const kd=Math.exp(-8*dt);S.kx*=kd;S.kz*=kd;
  moveHoriz((S.vx+S.kx)*dt,(S.vz+S.kz)*dt);resolveColliders();
  const was=S.grounded;P.y+=S.vy*dt;const g=groundH(P.x,P.z);
  if(P.y<=g||(was&&S.vy<=0&&P.y-g<0.45)){if(!was&&S.vy<-5)land(-S.vy);P.y=g;S.vy=0;S.grounded=true;S.jumps=0;}
  else{S.grounded=false;if(was&&S.jumps===0)S.jumps=1;}
  const hs=Math.hypot(S.vx,S.vz);
  if(hs>0.6)S.face=angLerp(S.face,Math.atan2(S.vx,S.vz),1-Math.exp(-14*dt));
  if(S.grounded&&hs>2){S.ph+=hs*dt*1.25;const st=Math.floor(S.ph/Math.PI);
    if(st!==S.lastStep){S.lastStep=st;puff(0.07,1200,0.1,'lowpass',500);burst(dust,P.x,P.y+0.05,P.z,hereH<0.1?4:2,1,0.6,footColor(P.y),0.45,0.35,-0.5);}}
  playerRoot.position.set(P.x,P.y,P.z);playerRoot.rotation.y=S.face;playerRoot.visible=G.invuln<=0||(Math.floor(T*20)%2===0);
  const aa=1-Math.exp(-18*dt),sw=Math.sin(S.ph)*0.95*Math.min(1,hs/6),air=!S.grounded;
  legL.rotation.x+=((air?-0.5:sw)-legL.rotation.x)*aa;legR.rotation.x+=((air?0.35:-sw)-legR.rotation.x)*aa;
  armL.rotation.x+=((air?-2.2:-sw*0.8)-armL.rotation.x)*aa;armR.rotation.x+=((air?-2.2:sw*0.8)-armR.rotation.x)*aa;

  body.rotation.x=Math.min(1,hs/8)*0.16;body.position.y=S.grounded?Math.abs(Math.sin(S.ph))*0.07*Math.min(1,hs/6):0;
  if(waveT>0){waveT-=dt;const k=1-Math.max(0,waveT)/0.35;waveMesh.visible=true;waveMesh.position.set(P.x,P.y+0.3,P.z);waveMesh.scale.setScalar(Math.max(0.1,waveRad*k));waveMesh.material.opacity=0.8*(1-k);}else waveMesh.visible=false;

}

/* ---------- crystals ---------- */
function collect(c){
  c.got=true;c.mesh.visible=c.glow.visible=c.beam.visible=false;
  if(c.drop){healPlayer(c.heal);burst(sparks,c.px,c.py,c.pz,16,4,3,c.col,0.45,0.6,2);tone(660,0.25,'sine',0.15);return;}
  G.crystals++;award(c.value);healPlayer(c.heal);c.respawn=10+rand()*10;
  sfxCollect(Math.min(G.combo,14),false);
  burst(sparks,c.px,c.py,c.pz,40,6,5,c.col,0.55,0.9,3);ring(sparks,c.px,c.py,c.pz,22,5,c.col,0.45,0.7);
  const lv=1+Math.floor(G.crystals/8);
  if(lv>G.level){G.level=lv;G.maxHp+=10;healPlayer(25);sfxLevel();say('Lantern level '+lv);}
  onCrystal(c);
}
function updateCrystals(dt){
  const night=ENV.st,act=mode==='play';
  { const hb=Math.sin(T*1.6)*0.25;heart.mesh.position.set(heart.px,heart.py+hb,heart.pz);heart.mesh.rotation.y+=dt*0.9;heart.glow.position.copy(heart.mesh.position);
    heart.mat.emissiveIntensity=0.9+0.7*night;heart.bm.opacity=0.2+0.2*night;heart.gm.opacity=0.55+0.4*night;heart.ring.position.copy(heart.mesh.position);heart.ring.rotation.set(T*0.8,T*0.5,0);}
  for(const c of crystals){
    if(c.got){
      if(!c.drop&&c.respawn>0){c.respawn-=dt;if(c.respawn<=0){const s=landSpot(1.0,34,0.8,{x:P.x,z:P.z},70,40);if(s)placeCrystal(c,s.x,s.z);else c.respawn=2;}}

    if(c.drop){c.ttl-=dt;if(c.ttl<=0){c.got=true;c.mesh.visible=c.glow.visible=false;continue;}c.mesh.visible=c.glow.visible=c.ttl>4||(Math.floor(T*8)%2===0);}
    const bob=Math.sin(T*2+c.ph)*0.18,dx=P.x-c.px,dy=P.y+1.1-c.py,dz=P.z-c.pz,d=Math.hypot(dx,dy,dz);

    }

/* ---------- camera ---------- */
let baseFov=62;
function updateCamera(dt){
  if(mode==='menu'){
    const a=T*0.12;camPos.set(SUM.x+Math.sin(a)*34,SUM.h+13,SUM.z+Math.cos(a)*34);camera.position.copy(camPos);camera.lookAt(SUM.x,SUM.h+5,SUM.z);

      if(e.st>1.0){e.state='chase';e.st=0;e.cd=3.2;slamRing.visible=false;sfxSlam();S.shake=0.5;ring(sparks,e.x,e.gy+0.4,e.z,50,14,0xff6a4d,0.8,0.6);burst(dust,e.x,e.gy+0.3,e.z,30,8,2,0x8a6a5a,1.4,0.8,-1);

  for(let j=0;j<MAP_PX;j++)for(let i=0;i<MAP_PX;i++){
    const x=(i/MAP_PX*2-1)*HALF,z=(j/MAP_PX*2-1)*HALF,h=groundH(x,z);
    if(h<-0.3)col.setHex(0x14506b).lerp(C(0x2f93b4),smooth(-5,-0.3,h));
    else if(h<0.6)col.setHex(0xe7d6a0);
    else{col.setHex(0x78b957).lerp(C(0x3c7a40),smooth(1,14,h));if(h>16)col.lerp(C(0x9a9ca5),smooth(16,24,h));}
    const sh=clamp(1+(groundH(x+3,z)-groundH(x-3,z))*-0.04,0.78,1.22),o=(j*MAP_PX+i)*4;
    img.data[o]=Math.min(255,col.r*255*sh);img.data[o+1]=Math.min(255,col.g*255*sh);img.data[o+2]=Math.min(255,col.b*255*sh);img.data[o+3]=255;
  }
  g.putImageData(img,0,0);resetFog();
}
function drawMap(){
  if(!mapBase)return;const px=mapCv.width,s=px/2,k=px/(2*VIEW);
  if(!mapTmp)mapTmp=document.createElement('canvas');if(mapTmp.width!==px){mapTmp.width=mapTmp.height=px;}
  const tctx=mapTmp.getContext('2d');tctx.globalCompositeOperation='source-over';tctx.clearRect(0,0,px,px);
  const sw=2*VIEW/WORLD*MAP_PX,sx=(P.x+HALF)/WORLD*MAP_PX-sw/2,sz=(P.z+HALF)/WORLD*MAP_PX-sw/2;
  const cl=Math.max(0,sx),ct=Math.max(0,sz),cr=Math.min(MAP_PX,sx+sw),cb=Math.min(MAP_PX,sz+sw);
  if(cr>cl&&cb>ct){const dx=(cl-sx)/sw*px,dy=(ct-sz)/sw*px,dw=(cr-cl)/sw*px,dh=(cb-ct)/sw*px;
    tctx.drawImage(mapBase,cl,ct,cr-cl,cb-ct,dx,dy,dw,dh);tctx.globalCompositeOperation='destination-in';tctx.drawImage(seenCv,cl,ct,cr-cl,cb-ct,dx,dy,dw,dh);tctx.globalCompositeOperation='source-over';}
  mctx.save();mctx.clearRect(0,0,px,px);mctx.beginPath();mctx.arc(s,s,s,0,6.283);mctx.clip();
  mctx.fillStyle='#0a1220';mctx.fillRect(0,0,px,px);mctx.drawImage(mapTmp,0,0);
  const dot=(wx,wz,r,fill,stroke)=>{let x=(wx-P.x)*k+s,y=(wz-P.z)*k+s;const dx=x-s,dy=y-s,l=Math.hypot(dx,dy),lim=s-r-2;if(l>lim){x=s+dx/l*lim;y=s+dy/l*lim;r*=0.7;}
    mctx.fillStyle=fill;mctx.beginPath();mctx.arc(x,y,r,0,6.283);mctx.fill();if(stroke){mctx.strokeStyle=stroke;mctx.lineWidth=px*0.012;mctx.stroke();}};
  dot(SUM.x,SUM.z,px*0.04,'#ffd166','#fff');
  if(G.senseT>0){for(const c of crystals){if(c.got||c.drop)continue;if(Math.hypot(c.px-P.x,c.pz-P.z)<110)dot(c.px,c.pz,px*0.024,'#fff','#'+('000000'+c.col.toString(16)).slice(-6));}}
  for(const c of crystals){if(c.got||!c.drop)continue;if(Math.hypot(c.px-P.x,c.pz-P.z)<40)dot(c.px,c.pz,px*0.02,'#ff5a5a',null);}
  for(const e of E){if(e.dead)continue;const d=Math.hypot(e.x-P.x,e.z-P.z);if(d<45||(e.boss&&d<VIEW*1.2))dot(e.x,e.z,e.boss?px*0.05:px*0.022,e.boss?'#ff3d5a':'#9b4dff',null);}
  const a=Math.atan2(-Math.cos(yaw),-Math.sin(yaw))+Math.PI/2;
  mctx.translate(s,s);mctx.rotate(a);mctx.fillStyle='#ff6a4d';mctx.strokeStyle='#fff';mctx.lineWidth=px*0.02;
  mctx.beginPath();mctx.moveTo(0,-px*0.06);mctx.lineTo(px*0.045,px*0.04);mctx.lineTo(0,px*0.02);mctx.lineTo(-px*0.045,px*0.04);mctx.closePath();mctx.fill();mctx.stroke();
  mctx.restore();
}

/* ---------- screens ---------- */
const panel=$('panel'),LS='shardfall.best2';
function getBest(){try{return parseFloat(localStorage.getItem(LS))||0;}catch(e){return 0;}}
function setBest(v){try{localStorage.setItem(LS,String(v));}catch(e){}}
function helpHTML(){return '<ul class="help"><li><b>Left thumb</b><span>Walk</span></li><li><b>Right thumb</b><span>Look around</span></li><li><b>Lantern</b><span>Pushes back and hurts everything near you</span></li><li><b>Sense</b><span>Tap the top compass (or E) to feel for nearby shards. Recharges slowly</span></li><li><b>Jump</b><span>Tap again in the air for a double jump</span></li><li><b>Dash</b><span>Quick burst. You cannot be hit while dashing</span></li></ul><p class="kbd">Computer: WASD or arrows, Space jump, Shift dash, F lantern, drag the mouse to look, P pause.</p>';}
function showScreen(kind,x){
  const best=getBest();let h='';
  if(kind==='start')h='<h1 class="title">Shardfall <span>Isle</span></h1><div class="story"><p>The star that watched over this island fell the night you were born. It broke into shards, and where the shards were torn away, the dark moved in.</p><p>You wake at the summit, in the light of its last piece. Gather the shards. Keep the Heart burning through every night.</p></div><div class="row"><button class="cta" id="ovGo" type="button">Wake up</button></div>'+gfxHTML()+'<details><summary>Controls</summary>'+helpHTML()+'</details>'+(best?'<p class="best">Best score '+fnum(best)+'</p>':'');
  else if(kind==='pause')h='<h1 class="title">Paused</h1><p class="lede">Score '+fnum(G.score)+'. Night '+Math.max(1,G.night)+'. Explored '+explPct()+'%.</p>'+helpHTML()+'<div class="row"><button class="cta" id="ovGo" type="button">Resume</button><button class="cta ghost" id="ovRestart" type="button">Start over</button></div>'+gfxHTML();
  else h='<h1 class="title">The light <span>went out</span></h1><div class="quote">'+DEATH_LINES[(Math.random()*DEATH_LINES.length)|0]+'<small>LUMEN</small></div><ul class="stats"><li><span>Score</span><b>'+fnum(G.score)+'</b></li><li><span>'+(x&&x.nb?'New best':'Best')+'</span><b>'+fnum(Math.max(best,G.score))+'</b></li><li><span>Nights</span><b>'+(G.survived||0)+'</b></li><li><span>Hollows</span><b>'+G.kills+'</b></li><li><span>Shards</span><b>'+G.crystals+'</b></li><li><span>Explored</span><b>'+explPct()+'%</b></li></ul><div class="row"><button class="cta" id="ovGo" type="button">Try again</button></div>';
  panel.innerHTML=h;$('screen').hidden=false;wireGfx();
  const go=$('ovGo');go.onclick=()=>{audioStart();if(kind==='pause')resumeGame();else startGame();};go.focus({preventScroll:true});
  const rs=$('ovRestart');if(rs)rs.onclick=()=>startGame();
}
function setPlayUI(on){['tally','compass','rightbox','btnDash','btnJump','btnPulse','stickBase'].forEach(id=>{$(id).hidden=!on;});if(!on){$('bossbar').hidden=true;}}
let prevPhase=0.12;
function resetWorld(){
  Object.assign(G,{score:0,combo:0,comboT:0,mult:1,hp:100,maxHp:100,level:1,crystals:0,kills:0,bossKills:0,invuln:0,pulseCD:0,time:0,night:0,hurt:0,inSafe:false,boss:null,spawnT:6,bossT:0,survived:0,senseT:0,senseCD:0,explored:0});resetFog();visited.clear();
  flags={};dispScore=0;hud.score='';hud.mult=0;hud.hpw=-1;hud.hpt='';$('hurt').style.opacity='0';
  for(const e of E)scene.remove(e.group);E.length=0;ORBS.forEach(o=>{o.on=false;o.mesh.visible=false;});slamRing.visible=false;
  crystals.forEach(c=>{if(c.drop){c.got=true;c.mesh.visible=c.glow.visible=c.beam.visible=false;}else placeCrystal(c,c.hx,c.hz);});
  P.x=SPAWN.x;P.z=SPAWN.z;P.y=groundH(P.x,P.z);
  Object.assign(S,{vx:0,vz:0,vy:0,kx:0,kz:0,grounded:true,jumps:0,dashT:0,dashCD:0,face:Math.PI,squash:0,stretch:0,shake:0});
  yaw=0;pitch=0.38;camPos.set(P.x+Math.sin(yaw)*camDist,P.y+4,P.z+Math.cos(yaw)*camDist);
  phase=0.12;prevPhase=phase;clearStory();playerRoot.visible=true;
}
function startGame(){
  const f=$('fade');f.classList.add('on');resetWorld();mode='play';$('screen').hidden=true;setPlayUI(true);resetStick();
  requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('on')));
  chapter('Prologue','The Last Light');
  story('LUMEN','Ember, you are awake. My light only reaches so far. Follow the beams and bring the shards home.',2.5);
  story('LUMEN','Press the lantern when the dark gets close. Anything near you will feel it.');
  story('LUMEN','Tap the compass at the top and I will sense shards close by. I cannot do it often, so explore.');
}
function pauseGame(){mode='pause';stick.id=null;look.id=null;resetStick();showScreen('pause');}
function resumeGame(){mode='play';$('screen').hidden=true;}
function gameOver(){
  if(mode==='over')return;mode='over';resetStick();sfxDead();const nb=G.score>getBest();if(nb)setBest(G.score);
  setPlayUI(false);clearStory();$('hurt').style.opacity='0.8';
  setTimeout(()=>{if(mode==='over')showScreen('over',{nb});},1800);
}
$('btnPause').addEventListener('click',()=>{if(mode==='play')pauseGame();});
$('btnMute').addEventListener('click',()=>setMuted(!AU.muted));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pauseGame();});

/* ---------- resize and quality ---------- */
const coarse=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
const QUAL=[{dpr:0.75,sh:0},{dpr:1,sh:0},{dpr:1.5,sh:1024},{dpr:2,sh:2048}];
const GFX_NAMES=['Smooth','Normal','High'],GFX_Q=[0,1,coarse?2:3],GFX_VD=[0.55,0.8,1];
let gfx=coarse?1:2;try{const g=parseInt(localStorage.getItem('shardfall.gfx'),10);if(g>=0&&g<=2)gfx=g;}catch(e){}
let qLevel=GFX_Q[gfx],lowStrikes=0,lastW=0,lastH=0;setView(GFX_VD[gfx]);
function setGfx(g){gfx=g;qLevel=GFX_Q[g];lowStrikes=0;setView(GFX_VD[g]);try{localStorage.setItem('shardfall.gfx',String(g));}catch(e){}applyQuality();updateChunks(camera.position.x,camera.position.z);}
function gfxHTML(){return '<div class="gfx"><span class="lbl">Graphics</span>'+GFX_NAMES.map((n,i)=>'<button type="button" class="gb" data-g="'+i+'" aria-pressed="'+(i===gfx)+'">'+n+'</button>').join('')+'</div>';}
function wireGfx(){panel.querySelectorAll('.gb').forEach(b=>{b.onclick=()=>{setGfx(+b.dataset.g);panel.querySelectorAll('.gb').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.g===gfx)));};});}
function applyQuality(){
  const q=QUAL[qLevel],pr=Math.min(window.devicePixelRatio||1,q.dpr);renderer.setPixelRatio(pr);
  sun.castShadow=q.sh>0;if(q.sh>0&&sun.shadow.mapSize.x!==q.sh){sun.shadow.mapSize.set(q.sh,q.sh);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}
  resize();
}
function resize(){
  lastW=window.innerWidth;lastH=window.innerHeight;const w=Math.max(1,lastW),h=Math.max(1,lastH);renderer.setSize(w,h);camera.aspect=w/h;baseFov=w/h<1?76:62;
  camera.updateProjectionMatrix();const pr=renderer.getPixelRatio();
  sparks.mat.uniforms.uScale.value=dust.mat.uniforms.uScale.value=pr*h*0.5;
  if(stick.id===null){DEF_STICK.y=h-112;placeStick(DEF_STICK.x,DEF_STICK.y);}
}
window.addEventListener('resize',()=>{resize();buildMap();});
let fpsAcc=0,fpsN=0;
function fpsTick(dt){
  if(mode!=='play')return;fpsAcc+=dt;fpsN++;
  if(fpsAcc>=2.5){const fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;
    if(fps<38&&(qLevel>0||VD>0.5)){if(++lowStrikes>=2){lowStrikes=0;if(qLevel>0){qLevel--;applyQuality();}else{setView(Math.max(0.5,VD-0.1));updateChunks(camera.position.x,camera.position.z);}}}else lowStrikes=0;}
}

/* ---------- main loop ---------- */
const clock=new THREE.Clock();
function safe(name,fn){try{fn();}catch(e){diag(name+': '+((e&&e.message)?e.message:e));}}
function phaseEvents(dt){
  if(mode!=='play'){prevPhase=phase;return;}
  if(prevPhase<0.5&&phase>=0.5)onNightStart();
  if(prevPhase<0.96&&phase>=0.96){G.survived++;onDawn();}
  prevPhase=phase;
  if(G.bossT>0){G.bossT-=dt;if(G.bossT<=0){if(spawnBoss())onBossArrive();else G.bossT=2;}}
  if(!flags.sawEnemy){for(const e of E){if(!e.dead&&Math.hypot(e.x-P.x,e.z-P.z)<45){flags.sawEnemy=1;story('EMBER','A Hollow. Do not let it touch me.');break;}}}
  if(!flags.low&&G.hp<G.maxHp*0.3){flags.low=1;story('LUMEN','Come back to the summit. My light will mend you.');}
}
let chunkT=0;
function frame(){
  requestAnimationFrame(frame);
  if(window.innerWidth!==lastW||window.innerHeight!==lastH)safe('resize',resize);
  const dt=Math.min(clock.getDelta(),0.05);
  if(mode==='pause'){safe('render',()=>renderer.render(scene,camera));return;}
  T+=dt;if(mode==='play')G.time+=dt;
  if(mode==='play')safe('player',()=>updatePlayer(dt));
  safe('phase',()=>phaseEvents(dt));
  if(mode==='play'||mode==='over')safe('enemies',()=>{updateEnemies(dt);updateSpawner(dt);});
  if(mode==='play')safe('story',()=>updateStory(dt));
  safe('crystals',()=>updateCrystals(dt));
  safe('camera',()=>updateCamera(dt));
  safe('sky',()=>{
    const fx=mode==='menu'?SUM.x:P.x,fy=mode==='menu'?SUM.h:P.y,fz=mode==='menu'?SUM.z:P.z;updateEnv(dt,fx,fy,fz);
    for(const c of clouds){c.position.x+=dt*1.6;if(c.position.x>640)c.position.x=-640;}
    shimA.material.map.offset.set(T*0.012,T*0.007);shimB.material.map.offset.set(-T*0.009,T*0.011);
    chunkT-=dt;if(chunkT<=0){chunkT=0.25;updateChunks(camera.position.x,camera.position.z);}
  });
  safe('effects',()=>{sparks.update(dt);dust.update(dt);musicTick(dt);});
  if(mode==='play')safe('hud',()=>{updateHud(dt);drawMap();});
  safe('render',()=>renderer.render(scene,camera));
  fpsTick(dt);
}
function buildMapSafe(){try{buildMap();}catch(e){diag('map: '+e.message);}}
buildMapSafe();
setMuted(AU.muted);resetStick();applyQuality();
playerRoot.position.set(P.x,P.y,P.z);playerRoot.rotation.y=S.face;
updateChunks(SUM.x,SUM.z);
showScreen('start');
frame();
})();
</script>
